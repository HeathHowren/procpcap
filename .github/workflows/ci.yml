name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  DEPS_CACHE_VERSION: v1

jobs:
  build:
    name: Build and test (${{ matrix.config }})
    # Pinned, not windows-latest: the generator below names a specific Visual
    # Studio, and a runner-image roll forward would remove it.
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      # Both CMakeLists files pin dependencies: the top-level one WinDivert,
      # tests/CMakeLists.txt Catch2. Hashing both keeps a bumped pin from
      # restoring the stale tree forever.
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ env.DEPS_CACHE_VERSION }}-${{ matrix.config }}-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}
          restore-keys: |
            deps-${{ env.DEPS_CACHE_VERSION }}-${{ matrix.config }}-

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config ${{ matrix.config }}

      # The unit tests need neither Administrator nor the WinDivert driver, so
      # they run on the stock runner. Live capture is a manual release check.
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure

      - name: Package
        if: matrix.config == 'Release'
        run: cpack --config build/CPackConfig.cmake -C Release -B build/package

      - name: Upload artifact
        if: matrix.config == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: procpcap
          path: build/package/*.zip
          if-no-files-found: error

  release:
    name: Attach build to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: procpcap
          path: dist

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body: |
            Extract the zip anywhere. `WinDivert.dll` and `WinDivert64.sys` sit
            next to `procpcap.exe` and must stay there. Run from an
            Administrator prompt.

            procpcap.exe is **unsigned**. The WinDivert driver is signed by its
            author, but antivirus software may flag it, and Windows can refuse
            to load it under Memory Integrity (HVCI) or Smart App Control.

            See CHANGELOG.md for what is new and THIRD_PARTY_NOTICES.md for
            licensing (procpcap is MIT; WinDivert is LGPL/GPL, used unmodified).
